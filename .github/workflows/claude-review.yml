name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. Such a pull request
# fails this job with a comment saying it needs a human review.

on:
  pull_request:
    # converted_to_draft is here to cancel, not to run. The job skips drafts, so
    # the run this starts exists only to take over the concurrency group and stop
    # a review of a pull request its author has just pulled back.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Dependabot is same-repo but
    # is handed dependabot secrets rather than the repository's, so it would fail
    # the token check and paint every dependency bump red; the type check keeps
    # every bot out for the same reason. Drafts are skipped until they are marked
    # ready, which is what the ready_for_review trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Nothing here pushes, and the action authenticates through the GitHub
          # App rather than this token. Leaving the token in the workspace git
          # config only widens what the third-party action can reach.
          persist-credentials: false

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      # The action skips, and still reports success, when this file differs
      # from the default branch's copy. A green check would then say the pull
      # request was reviewed when it was not, so say so on it and fail.
      - name: Refuse to look reviewed when the reviewer cannot run
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE" "$HEAD" -- .github/workflows/claude-review.yml; then
            exit 0
          fi
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "This pull request changes .github/workflows/claude-review.yml, so the Claude review cannot run on it. It needs a human review."
          echo "::error::the Claude review cannot run on a pull request that changes its own workflow; review it by hand"
          exit 1

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Comments carry no Claude attribution line.
          settings: '{"attribution": {"commit": "", "pr": ""}, "includeCoAuthoredBy": false}'
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            whosent is a Go TUI and CLI for reading delegation chains: JWT token exchange
            (RFC 8693 act), Biscuit, UCAN and macaroons. Each format is an adapter under
            internal/formats that evaluates its rules for every link without stopping at
            the first failure and describes the result in pkg/chain. internal/cmd is the
            cobra surface, internal/ui the Bubble Tea model, internal/trust the key
            loader, internal/termsafe the escaping of untrusted text, and `check` is meant
            to be usable as a CI gate.

            Do not repeat what CI already does. golangci-lint, go vet, govulncheck, the
            race-detector tests and the 85% coverage gate run on this PR already.

            Look for what only a reader can catch:

            1. Disagreement with a reference. Biscuit must match the specification's
               samples, UCAN its 1.0.0 fixtures, and macaroons are compared with
               go-macaroon or superfly/macaroon on every run (a disagreement exits 70).
               A change that loosens one of these, or edits the vendored test data to
               make a test pass, is the most serious finding.

            2. Honesty. A rule that was not checked (no keys, no revocation list, no
               audience) is UNCHECKED, never PASS, and never renders green or with a
               check mark. VALID requires every rule checked. AUTHORITATIVE requires a
               VALID chain with no missing input. A JWT's prior actors are asserted,
               never verified.

            3. Untrusted text reaching the terminal. Every string that comes from a
               chain, a key document, a library error or user input must pass through
               internal/termsafe before it is printed or rendered, or a chain can rewrite
               the screen. Look for new Printf, Sprintf into a view, or lipgloss Render of
               a claim value that skips the choke points.

            4. The network. Keys come only from flags and the trust file, never from a
               token (jku, x5u, x5c, jwk). Fetches stay https-only through redirects.

            5. Test shape. Chains are minted per run with throwaway keys rather than
               committed, because a committed assertion expires. Rendering tests must
               keep every line within the terminal width.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary, posted with
            `gh pr comment --edit-last --create-if-none` so that a re-review
            replaces the previous summary rather than stacking another one
            underneath it. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

            Write in English. Do not add a footer, a signature or a "Generated
            with" line to any comment.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
